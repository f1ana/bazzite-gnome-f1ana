---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bazzite-gnome-f1ana
description: Personal Bazzite GNOME image with native dev tools and browsers.

base-image: ghcr.io/ublue-os/bazzite-dx-gnome
image-version: stable-44 # latest is also supported

# WARNING: Do not use RPM Fusion repos in this recipe. Bazzite's base image uses
# negativo17 for multimedia and graphics packages (since Oct 2024), and RPM Fusion
# is incompatible — they ship conflicting versions of ffmpeg, gstreamer, mesa, etc.
# Enabling RPM Fusion will cause dependency resolution failures and broken updates.
# See: https://github.com/ublue-os/main/pull/636
#      https://github.com/ublue-os/main/issues/650
#

modules:
  - type: rpm-ostree
    install:
      - fuse-libs  # provides libfuse.so.2 for AppImage support; dropped from F44 base

  - type: rpm-ostree
    repos:
      - vscode.repo
    install:
      - code

  - type: rpm-ostree
    repos:
      - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    keys:
      - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      - brave-browser

  - type: rpm-ostree
    repos:
      - google-chrome.repo
    install:
      - google-chrome-stable
      - obs-studio
      - obs-studio-plugin-vkcapture
      - https://release.gitkraken.com/linux/gitkraken-amd64.rpm
      - https://github.com/nekename/OpenDeck/releases/download/v2.10.1/opendeck-2.10.1-1.x86_64.rpm
      - https://proton.me/download/mail/linux/ProtonMail-desktop-beta.rpm
      - https://github.com/veracrypt/VeraCrypt/releases/download/VeraCrypt_1.26.29/veracrypt-1.26.29-Fedora-44-x86_64.rpm
      - https://zoom.us/client/latest/zoom_x86_64.rpm

  - type: rpm-ostree
    repos:
      - protonvpn.repo
    install:
      - proton-vpn-gnome-desktop

  - type: script
    scripts:
      - install-obs-pipewire-audio.sh

  - type: rpm-ostree
    install:
      - dracut-sshd  # early-boot sshd in the initramfs, to unlock LUKS root over SSH

  - type: files
    files:
      - source: system
        destination: /

  - type: kargs
    kargs:
      - rd.neednet=1  # bring up the network in the initramfs
      - ip=dhcp

  - type: initramfs  # rebuild the initramfs with dracut-sshd, its keys and config

  # Flatpaks installed on first boot. Anything already in Bazzite's own list
  # (/etc/ublue-os/system_flatpaks) is intentionally left out.
  - type: default-flatpaks
    notify: true
    system:
      install:
        - ai.lmstudio.lm-studio
        - ch.protonmail.protonmail-bridge
        - com.bitwarden.desktop
        - com.brave.Browser
        - com.discordapp.Discord
        - com.geeks3d.furmark
        - com.mattjakeman.ExtensionManager
        - com.moonlight_stream.Moonlight
        - com.plexamp.Plexamp
        - com.ranfdev.DistroShelf
        - com.slack.Slack
        - dev.fredol.open-tv
        - dev.lizardbyte.app.Sunshine
        - io.ente.photos
        - io.github.antimicrox.antimicrox
        - io.github.astralvixen.geforce-infinity
        - io.github.unknownskl.greenlight
        - io.github.yuki_iptv.yuki-iptv
        - io.kapsa.drive
        - io.missioncenter.MissionCenter
        - md.obsidian.Obsidian
        - org.altlinux.Tuner
        - org.chromium.Chromium
        - org.filezillaproject.Filezilla
        - org.freac.freac
        - org.kde.isoimagewriter
        - org.libretro.RetroArch
        - org.mozilla.firefox
        - org.nicotine_plus.Nicotine
        - org.onlyoffice.desktopeditors
        - org.remmina.Remmina
        - org.tigervnc.vncviewer
        - org.videolan.VLC
        - tv.plex.PlexDesktop

  - type: signing
